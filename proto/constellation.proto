syntax = "proto3";

package constellation;

option go_package = "./proto";

service StellarDecoder {
  rpc DecodeSector (SectorRequest) returns (stream SparkPulse);
}

message SectorRequest {
  string sector_id = 1;
  int32 target_nodes = 2;
  float energy_level = 3;
}

message Vector3D {
  float x = 1;
  float y = 2;
  float z = 3;
}

message SparkPulse {
  string node_id = 1;
  string worker_language = 2; // "Python", "NET", "Go"
  Vector3D origin = 3;
  Vector3D target = 4;
  float latency_ms = 5;
  repeated Vector3D constellation_edges = 6;
}
